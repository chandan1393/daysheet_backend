# =============================================================================
# Daysheet API - PRODUCTION (the server)
# Started with --spring.profiles.active=prod (deploy/systemd/daysheet.service does this).
# Secrets are read from environment variables (/etc/daysheet/daysheet.env); none are stored here.
# Variables marked REQUIRED have no default: the app will not start without them.
# =============================================================================

# ---------- Server ----------
server.port=8080
# Only Nginx on the same machine can reach the API; port 8080 is never exposed to the internet.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Behind Nginx: trust X-Forwarded-For from the local proxy so rate limits see real client IPs.
server.forward-headers-strategy=native
server.tomcat.max-swallow-size=20MB
server.tomcat.connection-timeout=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ---------- Database ----------
# REQUIRED: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Optional SMTP fallback (leave SMTP_HOST empty when using Resend) ----------
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---------- App ----------
app.env=production
# REQUIRED: PUBLIC_URL (e.g. https://daysheet.in) and CORS_ORIGINS (same value)
app.public-url=${PUBLIC_URL}
app.cors.allowed-origins=${CORS_ORIGINS}
app.trial-days=${TRIAL_DAYS:14}

# REQUIRED: JWT_SECRET, a random string of 32+ characters (openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=72

# ---------- Email verification ----------
app.email.check-mx=${EMAIL_CHECK_MX:true}
app.email.unverified-retention-days=3

# ---------- Uploaded documents ----------
app.storage.dir=${STORAGE_DIR:/var/lib/daysheet/uploads}
app.storage.quota-mb-per-practice=${STORAGE_QUOTA_MB:2048}

# ---------- Razorpay (empty = online payments switched off) ----------
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ---------- Email ----------
# REQUIRED: RESEND_API_KEY (every signup needs a verification email)
app.mail.resend-api-key=${RESEND_API_KEY}
app.mail.from=${MAIL_FROM:Daysheet <hello@daysheet.in>}
app.mail.support=${SUPPORT_EMAIL:hello@daysheet.in}

# ---------- Business (starting values for Admin -> Company & GST; edit there afterwards) ----------
app.business.name=${BUSINESS_NAME:Xelvo Technologies}
app.business.legal-name=${BUSINESS_LEGAL_NAME:Chandan Sharma}
app.business.grievance-officer=${BUSINESS_GRIEVANCE_OFFICER:Manish Sharma}
app.business.address=${BUSINESS_ADDRESS:Khasra No. 299, Prashant Garden, Khoda Colony, Ghaziabad, Uttar Pradesh 201020}
app.business.phone=${BUSINESS_PHONE:+91 75038 57652}
app.business.gstin=${GST_NUMBER:09ECPPK7862F1ZY}
app.business.jurisdiction=${BUSINESS_JURISDICTION:Ghaziabad, Uttar Pradesh}

# ---------- GST ----------
app.gst.rate=${GST_RATE:18}
app.gst.prices-include-tax=${GST_PRICES_INCLUDE_TAX:true}
app.gst.sac=${GST_SAC:998314}
app.gst.invoice-prefix=${GST_INVOICE_PREFIX:DS}

# ---------- First admin (only when no admin exists; delete ADMIN_PASSWORD after the first start) ----------
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Admin}

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.daysheet=INFO
logging.level.org.hibernate.SQL=WARN
