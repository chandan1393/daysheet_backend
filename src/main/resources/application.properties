# =============================================================================
# Daysheet API - shared settings
# Each environment has its own complete file:
#   application-dev.properties   your computer (not in git; copy application-dev.properties.example)
#   application-prod.properties  the server (secrets come from environment variables)
# Pick one with --spring.profiles.active=dev|prod (or SPRING_PROFILES_ACTIVE). Dev is the default.
# =============================================================================
spring.application.name=daysheet-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

